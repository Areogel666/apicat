[package]
name = "apicat"
version = "1.0.3"
description = "ApiCat — a desktop API debugging tool"
authors = ["you"]
edition = "2021"

[lib]
name = "apicat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"   # 更新完成后重启应用

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# SQLite（通过 sqlx，直接在 Rust 层操作，不用 tauri-plugin-sql）
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros", "migrate"] }

# HTTP 客户端（M3 接口调试时用）
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "multipart"], default-features = false }

# 错误处理
thiserror = "1"
anyhow = "1"

# YAML 解析（用于 OpenAPI 3.x .yaml 导入）
serde_yaml = "0.9"

# Tauri 官方文件对话框插件（用于文件选择/保存）
tauri-plugin-dialog = "2"

# Tauri 官方文件系统插件（用于读写文件）
tauri-plugin-fs = "2"

# 导出 Postman 格式时生成 collection UUID
uuid = { version = "1", features = ["v4"] }

# 导出时生成 ISO 8601 时间戳
chrono = { version = "0.4", features = ["serde"] }

# 导入递归处理 Postman items 树（用于 async fn 中的递归调用）
async-recursion = "1"

# Basic Auth 编码（Bearer/Basic/API Key 认证）
base64 = "0.22"

# Tab 状态持久化
tauri-plugin-store = "2"

# Unix fd 上限检测（§10.2）；Windows 编译时无 Unix syscall
[target.'cfg(unix)'.dependencies]
libc = "0.2"
